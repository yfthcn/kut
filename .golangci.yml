version: "2"

# misspell bilerek yok: kaynak metinleri ve yorumlar Türkçe.
# Tek tük bilinçli istisnalar satırında `//nolint:<linter> // gerekçe` ile işaretlidir; burada yalnızca
# kod tabanının geneline yayılan kurallar var.
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
    - unparam
    - nilerr
    - copyloopvar
    - usestdlibvars
  settings:
    errcheck:
      # defer ile kapatma ve geçici dosya silme: hatanın yapılacak bir karşılığı yok (asıl hata zaten dönüyor).
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
    staticcheck:
      checks:
        - all
        # golangci-lint varsayılan dışlamaları
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
          - errorlint
          - usestdlibvars
